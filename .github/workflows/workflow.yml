name: Workflow sheelni-dash

env:
  BUILD_NUMBER: ${{ github.run_number }}
  ECR_REPOSITORY_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'app.sheelni.com' || github.ref == 'refs/heads/develop' && 'app.sheelni.dev' }}
  SHORT_BRANCH_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'production' || github.ref == 'refs/heads/develop' && 'develop' }}
  REACT_APP_BACKEND_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'https://api.sheelni.com' || github.ref == 'refs/heads/develop' && 'https://api.sheelni.dev' }}

on:
  push:
    branches:
      - develop
      - production


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # if: ${{ github.ref != 'refs/heads/develop' }} # Skip this job for 'develop' branch


    steps:
    - name: Checkout Code
      uses: actions/checkout@v3


    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_ACCESS_SECRET }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build Docker Image
      run: |
        docker build -t ${{ env.ECR_REPOSITORY_NAME }} --build-arg REACT_APP_BACKUP_URL=${{ env.REACT_APP_BACKEND_URL }}/api/ --build-arg REACT_APP_BACKEND_URL=${{ env.REACT_APP_BACKEND_URL }} -f Dockerfile .

    - name: Tag and Push Docker Image
      run: |
        docker tag ${{ env.ECR_REPOSITORY_NAME }} ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:${{ env.BUILD_NUMBER }}
        docker push ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:${{ env.BUILD_NUMBER }}
          
        docker tag ${{ env.ECR_REPOSITORY_NAME }} ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest
        docker push ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest

    - name: Log out of Amazon ECR
      if: always()
      run: docker logout ${{ steps.login-ecr.outputs.registry }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v0.1.9
      with:
        
        host: ${{ env.SHORT_BRANCH_NAME == 'production' && secrets.EC2_HOST_PRODUCTION || env.SHORT_BRANCH_NAME == 'develop' && secrets.EC2_HOST}}
        username: ${{ env.SHORT_BRANCH_NAME == 'production' && secrets.EC2_USER_PRODUCTION || env.SHORT_BRANCH_NAME == 'develop' && secrets.EC2_USER}}
        key: ${{ env.SHORT_BRANCH_NAME == 'production' && secrets.EC2_SSH_PRIVATE_KEY_PRODUCTION || env.SHORT_BRANCH_NAME == 'develop' && secrets.EC2_SSH_PRIVATE_KEY}}
        timeout: 30s
        command_timeout: 10m

        script: |
          sudo bash -c '
            cd /home/ubuntu/sheelni-devops/${{ env.SHORT_BRANCH_NAME }}/sheelni-dash
            git reset --hard
            git pull 

            echo "ECR_REPOSITORY_NAME=${{ env.ECR_REPOSITORY_NAME }}" > .env
            echo "ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}" >> .env
           
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_ACCESS_SECRET }}
            aws configure set region ${{ secrets.AWS_REGION }} 
            aws ecr get-login-password --region ${{ secrets.ECR_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker compose --env-file .env pull
            docker compose --env-file .env up -d --no-deps
            docker image prune -f
          '