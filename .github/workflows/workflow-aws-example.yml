name: CI/CD -> LMS-frontend

env:
  ECR_REPOSITORY_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'lms-frontend-production' || github.ref == 'refs/heads/develop' && 'lms-frontend-develop' }}
  SHORT_BRANCH_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'production' || github.ref == 'refs/heads/develop' && 'develop' }}
  REACT_APP_BASEURL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'https://api-v2.rebootkamp.net' || github.ref == 'refs/heads/develop' && 'https://api-dev.rebootkamp.net' }}
  REACT_APP_JS_MICRO_SERVICE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'https://api-v2-js-tester.rebootkamp.net' || github.ref == 'refs/heads/develop' && 'https://api-dev-js-tester.rebootkamp.net' }}
on:
  push:
    branches:
      - productionx
      - developx

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Get commit hash
        id: get_commit_hash
        run: echo "::set-output name=COMMIT_HASH::$(git rev-parse --short HEAD)"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.ECR_REGION }} 

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          COMMIT_HASH: ${{ steps.get_commit_hash.outputs.COMMIT_HASH }}
        run: |

          docker build --build-arg REACT_APP_BASEURL=${{ env.REACT_APP_BASEURL }} --build-arg  REACT_APP_JS_MICRO_SERVICE=${{ env.REACT_APP_JS_MICRO_SERVICE }} -t ${{ env.ECR_REPOSITORY_NAME }} .
          
          docker tag ${{ env.ECR_REPOSITORY_NAME }} ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:$COMMIT_HASH
          docker push ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:$COMMIT_HASH
          
          docker tag ${{ env.ECR_REPOSITORY_NAME }} ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest
          docker push ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest
          
      - name: Log out of Amazon ECR
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: SSH into EC2 and deploy 
        uses: appleboy/ssh-action@master
        with:
        
          host: ${{ env.SHORT_BRANCH_NAME == 'production' && secrets.EC2_HOST_PRODUCTION || env.SHORT_BRANCH_NAME == 'develop' && secrets.EC2_HOST_DEVELOP}}
          username: ${{ env.SHORT_BRANCH_NAME == 'production' && secrets.EC2_USERNAME_PRODUCTION || env.SHORT_BRANCH_NAME == 'develop' && secrets.EC2_USERNAME_DEVELOP}}
          key: ${{ env.SHORT_BRANCH_NAME == 'production' && secrets.EC2_PRIVATE_KEY_PRODUCTION || env.SHORT_BRANCH_NAME == 'develop' && secrets.EC2_PRIVATE_KEY_DEVELOP}}

          script: |
          
            cd /home/ubuntu/LMS-deploy/frontend/${{ env.SHORT_BRANCH_NAME }}
            git pull

            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws configure set region ${{ secrets.ECR_REGION }} 
            aws ecr get-login-password --region ${{ secrets.ECR_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker pull ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest
            docker stop ${{ env.ECR_REPOSITORY_NAME }}
            docker rm ${{ env.ECR_REPOSITORY_NAME }}
            docker run -d -p 3000:80 --env-file=.env --name ${{ env.ECR_REPOSITORY_NAME }} ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_NAME }}:latest

